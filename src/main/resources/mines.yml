MMOCORE:
  RUBY_LEVEL: #Used as level name on data
    DISPLAY_NAME: "ขุด Ruby"
    TYPE: "MINING"
    SOUND_FAIL: "BLOCK_ANVIL_FALL"
    BEGIN_CUSTOM_ITEM: "iasurvival:ruby_block"
    EXP_GAIN:
      MIN: 10
      MAX: 20
    REWARDS:
      1:
        - 'say %player% is now level 1 give them some reward'
      2:
        - 'say %player% is now level 2 give them some reward'
    REQUIREMENT:
      1:
        LEVEL: 4
        ITEM_ALLOWED: "iasurvival:crystal_block"
      2:
        LEVEL: 20
        ITEM_ALLOWED: "iasurvival:spinel_block"
  TURQUOISE_LEVEL: #Used as level name on data
    DISPLAY_NAME: "ขุด Turquoise"
    TYPE: "MINING"
    SOUND_FAIL: "BLOCK_ANVIL_FALL"
    BEGIN_CUSTOM_ITEM: "iasurvival:turquoise_ore"
    EXP_GAIN:
      MIN: 10
      MAX: 20
    REQUIREMENT:
      1:
        LEVEL: 10
        ITEM_ALLOWED: "iasurvival:cassiterite_ore"
      2:
        LEVEL: 20
        ITEM_ALLOWED: "iasurvival:dark_amethyst_ore"